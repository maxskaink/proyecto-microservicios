name: Go Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Download modules
        run: go mod download

      - name: Run tests
        env:
          # Adjust these if your integration tests require an explicit URL
          DATABASE_URL: postgres://test:secret@localhost:5432/testdb?sslmode=disable
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
        run: |
          # Run all tests (unit + integration). Job will fail if any test fails.
          go test ./... -v
