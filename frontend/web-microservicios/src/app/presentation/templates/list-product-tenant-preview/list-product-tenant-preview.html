
     <!-- Sección del Tenant -->
<div class="tenant-section mb-5" *ngIf="hasProducts">
  
  <!-- Header del tenant -->
  <div class="tenant-header mb-4">
    <h3 class="tenant-title">
      <i class="bi bi-shop me-2"></i>
      {{ tenantName || 'Tienda: ' + tenantid }}
    </h3>
    <div class="tenant-info">
      <span class="badge bg-primary">
        {{ productsToShow.length }} producto{{ productsToShow.length === 1 ? '' : 's' }}
      </span>
    </div>
  </div>

  <!-- Grid de productos del tenant -->
  <div class="products-grid">
    <div class="row g-4">
      <div 
        *ngFor="let product of productsToShow" 
        class="col-sm-6 col-md-4 col-lg-3">
        <app-product-box 
          [product]="product"
          (productClick)="onProductClick($event)">
        </app-product-box>
      </div>
    </div>
  </div>

  <!-- Separador entre tenants -->
  <hr class="tenant-separator mt-5">

</div>

<!-- Mensaje cuando no hay productos -->
<div class="no-products text-center py-4" *ngIf="!hasProducts">
  <div class="text-muted">
    <i class="bi bi-box-seam" style="font-size: 2rem;"></i>
    <p class="mt-2">No hay productos disponibles para {{ tenantName || 'este tenant' }}</p>
  </div>
</div>
