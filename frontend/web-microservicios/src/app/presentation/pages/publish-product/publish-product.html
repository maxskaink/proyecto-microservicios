<app-header></app-header>
<div>
    <div class="publish-product-container py-5">
           <h2 class="title">Publicar Nuevo Producto</h2>
        <div class="container-fluid container-form">
         
            <form (ngSubmit)="onSubmit(productForm)" #productForm="ngForm" novalidate>
               <div class="mb-3 mt-5">
                    <!-- Contenedor cuadrado -->
                    <label for="productImage" class="image-upload-box d-flex flex-column justify-content-center align-items-center">
                        <i class="bi bi-camera-fill camera-icon"></i>
                        <span class="small text-muted">Seleccionar imagen</span>
                    </label>

                    <!-- input oculto -->
                    <input 
                        type="file"
                        id="productImage"
                        class="d-none"
                        accept="image/*"
                        (change)="onImageChange($event)"
                        [disabled]="isSubmitting"
                        required
                        #fileInput
                    />

                    <div *ngIf="isImageInvalid" class="text-danger small mt-2">
                        {{ imageError }}
                    </div>

                    <div *ngIf="imagePreview" class="mt-3">
                        <label class="form-label small">Vista previa:</label>
                        <div class="preview-container">
                            <img 
                                [src]="imagePreview" 
                                alt="Preview del producto" 
                                class="img-thumbnail"
                                style="max-width: 300px; max-height: 200px; object-fit: contain;"
                            />
                        </div>
                    </div>
                </div>          
                <div class="mb-3 mt-5">
                    <label for="productName" class="form-label">Nombre del Producto</label>
                    <input 
                        type="text" 
                        id="productName" 
                        class="form-control" 
                        required 
                        [(ngModel)]="product.name" 
                        name="name" 
                        #name="ngModel">
                    <div *ngIf="name.invalid && name.touched" class="text-danger">
                        El nombre del producto es obligatorio.
                    </div>
                </div>

                <div class="mb-3 mt-5">
                    <label for="productCategory" class="form-label">Categoría del Producto</label>

                    <select 
                        id="productCategory"
                        class="form-control"
                        required
                        [(ngModel)]="product.category"
                        name="category"
                        #category="ngModel">

                        <option value="" disabled selected>Seleccione una categoría</option>
                        <option *ngFor="let cat of categories" [value]="cat">
                            {{ cat }}
                        </option>
                    </select>

                    <div *ngIf="category.invalid && category.touched" class="text-danger">
                        La categoría del producto es obligatoria.
                    </div>
                </div>
                <div class="mb-3 mt-5">
                <label for="productDescription" class="form-label">Descripción</label>
                <textarea 
                    id="productDescription" 
                    class="form-control" 
                    required 
                    [(ngModel)]="product.description" 
                    name="description" 
                    #description="ngModel"></textarea>
                <div *ngIf="description.invalid && description.touched" class="text-danger">
                    La descripción es obligatoria.
                </div>
                </div>
                <div class="mb-3 mt-5" >
                <label for="productStock" class="form-label">Stock</label>
                <input 
                    type="number" 
                    id="productStock" 
                    class="form-control" 
                    required
                    min="1"
                    [(ngModel)]="product.stock" 
                    name="stock" 
                    #stock="ngModel">

                    <div *ngIf="stock.errors?.['required'] && stock.touched" class="text-danger">
                        El stock es obligatorio.
                    </div>

                    <div *ngIf="stock.errors?.['min'] && stock.touched" class="text-danger">
                        El stock debe ser mayor que 0.
                    </div>

                </div>
                <div class="mb-3 mt-5">
                    <label for="productUnits" class="form-label">Unidades</label>
                    <select 
                        id="productUnits"
                        class="form-control"
                        required
                        [(ngModel)]="product.unit"
                        name="unit"
                        #category="ngModel">

                        <option value="" disabled selected>Seleccione una categoría</option>
                        <option *ngFor="let unit of units" [value]="unit">
                            {{ unit }}
                        </option>
                    </select>

                </div>
                <div class="mb-3 mt-5 price-container">
                <label for="productPrice" class="form-label">Precio</label>

                <div class="input-wrapper">
                    <span class="currency-symbol">$</span>

                    <input 
                    type="number" 
                    id="productPrice" 
                    class="form-control price-input"
                    required
                    min="1"
                    [(ngModel)]="product.price" 
                    name="price" 
                    #price="ngModel">
                </div>

                <div *ngIf="price.errors?.['required'] && price.touched" class="text-danger">
                    El precio es obligatorio.
                </div>
                <div *ngIf="price.errors?.['min'] && price.touched" class="text-danger">
                    El precio debe ser mayor que 0.
                </div>
                </div>
                <button type="submit" class="btn" [disabled]="productForm.invalid || isSubmitting">
                    <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2" role="status"></span>
                    {{ isSubmitting ? 'Publicando...' : 'Publicar Producto' }}
                </button>
            </form>
        </div>
    </div>
</div>
