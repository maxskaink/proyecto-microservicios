<!-- Header fijo con Bootstrap -->
<nav class="navbar navbar-dark bg-primary fixed-top shadow-sm">
  <div class="container-fluid d-flex justify-content-between align-items-center flex-wrap">

    <!-- Botón hamburguesa (siempre visible a la izquierda) -->
    <button 
      class="navbar-toggler me-3" 
      type="button" 
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen"
      aria-controls="navbarNav"
      aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Usuario y carrito (alineados a la derecha y adaptables) -->
    <div class="d-flex align-items-center flex-wrap justify-content-end text-white">

      <!-- Usuario -->
      <div class="d-flex align-items-center me-3 mt-2 mt-md-0">
        <i 
          class="bi bi-person-circle fs-3 me-2" 
          style="cursor: pointer;"
        ></i>
        <span class="fw-semibold d-none d-sm-inline">{{ currentUser?.name }}</span>
      </div>

      <!-- Carrito -->
      <button 
        class="btn position-relative text-white" 
        (click)="goToCart()"
        title="Carrito de compras">
        <i class="bi bi-cart3 fs-4"></i>
        <span 
          *ngIf="cartItemCount > 0" 
          class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
          {{ cartItemCount }}
          <span class="visually-hidden">productos en carrito</span>
        </span>
      </button>

    </div>

  </div>
</nav>

<!-- Subnavbar con catálogo e historial -->
<section 
  id="helpNavbar" 
  class="bg-light py-2 shadow-sm fixed-top"
  style="top: 56px;"
>
  <div class="container p-2">
    <div class="row align-items-center gy-2">
      
      <!-- Catálogo e historial -->
      <div class="col-12 col-md-6 d-flex justify-content-center justify-content-md-start gap-3">
        <p class="fw-bold mb-0 " style="cursor: pointer;">Catálogo</p>
        <p class="fw-bold mb-0" style="cursor: pointer;">Historial</p>
      </div>

      <!-- Barra de búsqueda -->
      <div class="col-12 col-md-6">
        <form 
          class="d-flex justify-content-center justify-content-md-end mx-md-3"
          (ngSubmit)="onSearch()"
        >
          <input 
            class="form-control me-2 w-100 w-md-auto" 
            type="search" 
            placeholder="Buscar productos..."
            aria-label="Buscar"
            [(ngModel)]="searchTerm"
            name="searchTerm"
          >
          <button class="btn btn-light text-primary" type="submit">
            <i class="bi bi-search"></i>
          </button>
        </form>
      </div>

    </div>
  </div>
</section>

<!-- Espaciador para compensar el header fijo -->
<div class="header-spacer"></div>
