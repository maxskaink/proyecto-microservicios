<div class="card mb-3 shadow-sm" style="width: 18rem;">
  <img [src]="product.photo_url" class="card-img-top" [alt]="product.description">
  <div class="card-body">
    <h5 class="card-title text-capitalize">{{ product.category }}</h5>
    <p class="card-text">{{ product.description }}</p>
    <p><strong>Precio:</strong> {{ product.price | currency:'COP':'symbol':'1.0-0' }}</p>
    <p><strong>Stock:</strong> {{ product.stock }} {{ product.unit }}</p>
  </div>
</div>
