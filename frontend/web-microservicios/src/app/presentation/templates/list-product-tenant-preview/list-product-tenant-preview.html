<div class="tenant-section">
    <div class="row g-3"> 
      <div 
        *ngFor="let product of products"
        class="col-lg-3 col-md-4 col-12 d-flex justify-content-center">
        
        <app-product-box 
          [product]="product"
          (productClick)="onProductClick($event)">
        </app-product-box>

      </div>
    </div>
</div>
