
<div class="tenant-section mb-5" >
  <!-- Grid de productos del tenant -->
  <div class="products-grid">
    <div class="row g-4">
      <div 
        *ngFor="let product of products" 
        class="col-sm-6 col-md-4 col-lg-3">
        <app-product-box 
          [product]="product"
          (productClick)="onProductClick($event)">
        </app-product-box>
      </div>
    </div>
  </div>

  <!-- Separador entre tenants -->
  <hr class="tenant-separator mt-5">

</div>
