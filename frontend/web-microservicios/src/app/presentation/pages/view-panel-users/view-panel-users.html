<app-is-loading></app-is-loading>
<app-header></app-header>
<div class="container">
    <div >
        <h2 class="title">Administra tus usuarios</h2>
        <p>Gestiona todos los usuarios</p>
    </div>
    <section  class="users-container">
        <section class="row">
        <h3>Adinistradores: </h3>
            <app-user-box
                *ngFor="let admin of admins"
                [user]="admin"
                (action)="onAction($event)"
            ></app-user-box>
        </section>
        <section class="row">
            <h3>Productores: </h3>
            <app-user-box
                *ngFor="let producer of producers"
                [user]="producer"
                (action)="onAction($event)"
            ></app-user-box>
        </section>
        <section class="row">
            <h3>Clientes: </h3>
            <app-user-box
                *ngFor="let user of users"
                [user]="user"
                (action)="onAction($event)"
            ></app-user-box>
        </section>

    </section>
    
</div>
