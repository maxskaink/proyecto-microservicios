<app-header class="mb-3"></app-header>
<section class="container section-box">
    <section class="section-title d-flex flex-column align-items-center mb-4">  
        <h2 class="title">Detalle de Envío</h2>
        <p class="text">Información del envío de tu orden</p>
    </section>
    <div class="row g-3">
        <app-item-order class="col-12 col-md-6 col-lg-6"
            [order]="orderInfo"
            [showActions]="false"
            (action)="onActionEvent($event)"
        ></app-item-order>
        <app-shipping class="col-12 col-md-6 col-lg-6"
            [shipping]="shippingInfo"
        ></app-shipping>
    </div>

</section>
