<app-is-loading></app-is-loading>
<app-header></app-header>

<section class="search-page-wrapper">
  <!-- Hero Section -->
  <section class="search-hero">
    <div class="hero-content">
      <h1 class="hero-title text-center">Resultados de búsqueda</h1>
      <p class="hero-subtitle text-center mb-4" *ngIf="searchTerm">Busca lo que necseites em el momento que lo necesites</p>
    </div>
        <section class="filter-bar-section">
      <div class="filter-bar">
        <!-- Filtro de Búsqueda -->
        <div class="filter-search">
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0">
              <i class="bi bi-search"></i>
            </span>
            <input 
              type="text" 
              class="form-control border-start-0" 
              placeholder="Refinar búsqueda..."
              (input)="onSearchChange($event.target.value)"
              [(ngModel)]="searchName">
          </div>
        </div>

        <!-- Filtro de Categoría -->
        <div class="filter-category">
          <div class="category-select-group">
            <label class="form-label mb-2">
              <i class="bi bi-tag"></i>
              Categoría
            </label>
            <select 
              class="form-select"
              [(ngModel)]="selectedCategory"
              (change)="onCategoryChange(selectedCategory)">
              <option value="todos">Todas</option>
              <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
            </select>
          </div>
        </div>

        <!-- Filtro de Precio -->
        <div class="filter-price">
          <div class="price-input-group">
            <label class="form-label mb-2">
              <i class="bi bi-tag"></i>
              Precio: <strong>${{ maxPrice | number:'1.0-0' }}</strong>
            </label>
            <input 
              type="range" 
              class="form-range" 
              min="0" 
              [max]="maxProductPrice"
              (input)="onPriceChange($event.target.valueAsNumber)"
              [(ngModel)]="maxPrice">
          </div>
        </div>

        <!-- Información y Botón Limpiar -->
        <div class="filter-actions">
          <span class="product-count">
            <i class="bi bi-grid-3x3-gap"></i>
            {{ filteredProducts.length || 0 }} productos
          </span>
          <button 
            class="btn btn-sm btn-outline-secondary" 
            (click)="clearFilters()"
            *ngIf="searchName !== searchTerm || selectedCategory !== 'todos' || maxPrice !== maxProductPrice">
            <i class="bi bi-arrow-counterclockwise"></i>
            Limpiar
          </button>
        </div>
      </div>
    </section>

  </section>

  <!-- Main Content -->
  <div class="container-fluid search-container">
    <!-- Barra de Filtros -->

    <!-- Grid de Productos -->
    <section class="products-section"*ngIf="filteredProducts.length !== 0 && allProducts.length !== 0">
      <div class="products-grid">
        <app-list-product-tenant-preview
          [products]="filteredProducts"
          (productClick)="onProductClick($event)"
        ></app-list-product-tenant-preview>
      </div>
    </section>

    <!-- Mensaje cuando no hay productos -->
    <section class="empty-state" *ngIf="filteredProducts.length === 0 && allProducts.length === 0">
      <div class="empty-content">
        <i class="bi bi-inbox"></i>
        <h3>No se encontraron resultados</h3>
        <p>Intenta con otros términos de búsqueda</p>
      </div>
    </section>

    <!-- Mensaje cuando hay productos pero ninguno coincide con los filtros -->
    <section class="empty-state container" *ngIf="filteredProducts.length === 0 && allProducts.length > 0">
      <div class="empty-content">
        <i class="bi bi-search"></i>
        <h3>No hay productos que coincidan</h3>
        <p>Intenta ajustar tus filtros de búsqueda</p>
        
      </div>
    </section>
  </div>
</section>
