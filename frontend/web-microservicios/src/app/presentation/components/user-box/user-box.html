<!-- User Box Card -->
<div class="user-card" (click)="clickAction()">
  <div class="card h-100 border-0 shadow-sm">
    
    <!-- Card Body -->
    <div class="card-body p-3 d-flex align-items-center">
      
      <!-- Avatar Section -->
      <div class="avatar-section me-3 flex-shrink-0">
        <div class="avatar-container position-relative">
          <img
            *ngIf="user?.profile?.avatar_url"
            [src]="user.profile.avatar_url"
            [alt]="user.name || 'Usuario'"
            class="avatar-image"
          />
          <div class="status-indicator"></div>
        </div>
      </div>

      <!-- User Info Section -->
      <div class="user-info flex-grow-1 min-width-0">
        <div class="user-details">
          <h6 class="user-name mb-1">{{ user.name || 'Usuario' }}</h6>
          <p class="user-email text-muted mb-2">{{ user.email || 'Sin email' }}</p>
          
          <!-- Role Badge -->
          <span class="role-badge" [ngClass]="getRoleClass(user.rol)">
            <i [class]="getRoleIcon(user.rol)" class="me-1"></i>
            {{ getRoleLabel(user.rol) }}
          </span>
        </div>
      </div>

      <!-- Action Icon -->
      <div class="action-section flex-shrink-0">
        <div class="action-icon">
          <i class="bi bi-chevron-right"></i>
        </div>
      </div>
    </div>
  </div>
</div>
