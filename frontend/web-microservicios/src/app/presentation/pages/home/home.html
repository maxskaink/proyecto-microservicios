<app-is-loading></app-is-loading>
<app-header></app-header>
<div class="category-section">
  <div class="d-flex justify-content-center align-items-center  flex-column ">
    <h2 id="title-welcome">¿Que necesitas hoy en tu hogar?</h2>
  </div>
  
  <!-- Barra de Búsqueda Moderna -->
  <div class="search-bar-container">
    <div class="container-fluid">
      <div class="search-bar-wrapper">
        <div class="input-group search-input-group">
          <span class="input-group-text search-icon">
            <i class="bi bi-search"></i>
          </span>
          <input 
            type="text" 
            class="form-control search-input" 
            placeholder="Buscar productos..."
            (keyup.enter)="goToSearch()"
            [(ngModel)]="searchQuery">
          <button 
            class="btn btn-search" 
            type="button"
            (click)="goToSearch()">
            <span class="search-button-text">Buscar</span>
            <i class="bi bi-arrow-right"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="divider-separator container-fluid "></div>
<section class="home-page-content ">
  <div class="container p-4 ">
    <div class="d-flex align-items-center justify-content-center flex-column text-center ">
        <h2 class="mt-4">Explora por categorias</h2>
        <p>Encuentra exactamente lo que necesitas navegando por nuestras categorías de productos frescos</p>
    </div>
  </div>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-6 col-lg-2 p-3" *ngFor="let category of categories">
        <div class="card-section d-flex justify-content-center align-items-center p-3"
            [ngStyle]="{ 'background-image': 'url(' + category.img + ')' }"
            style="background-size: cover; background-position: center; cursor: pointer;"
            (click)="onCategoryClick(category.name)">
            
          <p class=" shadow-text">{{ category.name }}</p>
        </div>
      </div>
    </div>

  </div>
  <div class="container p-4 container-title-products">
    <div class="d-flex  flex-column mt-4 pt-4">
        <h2 class="text-help-primary">Todos los productos</h2>
        <p class="text-help-secundary">Descubre nuestra amplia gama de productos frescos y de calidad para tu hogar</p>
    </div>
    <div class="mini-divider"></div>

  </div>
  <div class="container allProducts " >
        <app-list-product-tenant-preview
          [products]="allProducts"
          (productClick)="onProductClick($event)"
        ></app-list-product-tenant-preview>
  </div>
</section>
