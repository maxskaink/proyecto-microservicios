<app-header></app-header>
<div class="orders-container container-fluid">
  <div class="header">
    <button class="back-button" routerLink="/user">
      <app-arrow-left></app-arrow-left>
    </button>
  </div>

  <!-- Loading state -->
  <div *ngIf="isLoading" class="loading">
    <p>Cargando órdenes...</p>
  </div>

  <!-- Error state -->
  <div *ngIf="!isLoading && error" class="error-message">
    <p>{{ error }}</p>
    <button (click)="refreshOrders()">Reintentar</button>
  </div>

  <!-- Empty orders -->
  <div *ngIf="!isLoading && !error && orders.length === 0" class="empty-orders">
    <h2>No tienes órdenes aún</h2>
    <p>Cuando realices pedidos aparecerán aquí</p>
    <button routerLink="/home" class="btn btn-primary mb-3">
      Ir a comprar
    </button>
  </div>

  <!-- Orders list -->
  <div *ngIf="!isLoading && !error && orders.length > 0" class="orders-list ">
    <div class="row g-3">
      <div *ngFor="let order of orders" class="col-12 col-md-6 col-lg-4">
        <app-item-order [order]="order" (action)="handlerOrderAction($event)" ></app-item-order>
      </div>
    </div>
  </div>

</div>
