<app-header></app-header>
<div class="descriptio-welcome d-flex justify-content-center align-items-center flex-column ">
  <h2 id="title-welcome">¿Que necesitas hoy en tu hogar?</h2>
</div>
<div class="category-section container-fluid d-flex align-items-center justify-content-center "> 
    <div *ngFor="let category of categories" class="row m-2">
      <div class="card-section d-flex justify-content-center align-items-center flex-column p-3" 
          (click)="scrollToSection('category-' + category, $event)"
          style="text-decoration: none; color: inherit; cursor: pointer;">
        <p>{{category}}</p>
      </div>   
    </div>
</div>
<section class="home-page-content">
  <div class="container-fluid" >
   <div *ngFor="let category of categories" class="row">
      <app-list-product-tenant-preview
        [category]="category"
        [products]="productsByCategory[category]"
        (productClick)="onProductClick($event)"
        [id]="'category-' + category"
      ></app-list-product-tenant-preview>
    </div>
  </div>
</section>
