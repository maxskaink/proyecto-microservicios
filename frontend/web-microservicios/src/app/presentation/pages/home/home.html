<app-header></app-header>
<div class="category-section">
  <div class="text-center d-flex justify-content-center align-items-center flex-column ">
    <h2 id="title-welcome">¿Que necesitas hoy en tu hogar?</h2>
  </div>

  <div class=" d-flex align-items-center justify-content-center"> 
      <div *ngFor="let category of categories" class="col-auto m-2">
        <div class="card-section d-flex justify-content-center align-items-center p-3" 
            (click)="scrollToSection('category-' + category, $event)"
            style="text-decoration: none; color: inherit; cursor: pointer;">
          <p class="mb-0 text-center">{{category}}</p>
        </div>   
      </div>
  </div>

</div>
<section class="home-page-content">
  <div class="container-fluid" >
   <div *ngFor="let category of categories" class="row">
      <app-list-product-tenant-preview
        [category]="category"
        [products]="productsByCategory[category]"
        (productClick)="onProductClick($event)"
        [id]="'category-' + category"
      ></app-list-product-tenant-preview>
    </div>
  </div>
</section>
