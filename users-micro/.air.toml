# Air config para desarrollo
root = "."
tmp_dir = "tmp"

[build]
cmd = "go run ./cmd/server"
bin = "tmp/app"            # no se usa con go run, pero Air lo requiere
include_ext = ["go","mod","sum"]
exclude_dir = ["vendor","tmp",".git","dist","bin","docs"]
delay = 1000
stop_on_error = true
send_interrupt = true

[log]
time = true

[color]
main = "yellow"
watcher = "cyan"
build = "green"
runner = "magenta"