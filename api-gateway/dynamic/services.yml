http:
  routers:
    # Router para usuarios - con patrón de tenant
    users:
      rule: "PathPrefix(`/api/users`)"
      service: "users-service"
      entrypoints:
        - web
      middlewares:
        - strip-prefix
    
    # Router para usuarios con tenant explícito
    users-tenant:
      rule: "PathPrefix(`/{tenant:[a-zA-Z0-9_-]+}/api/users`)"
      service: "users-service"
      entrypoints:
        - web
      middlewares:
        - tenant-extractor
        - strip-prefix
    
    dashboard:
      rule: "PathPrefix(`/dashboard`)"
      service: "api@internal"
      entrypoints:
        - dashboard
      priority: 10
    
    # Router para productos - con patrón de tenant
    products:
      rule: "PathPrefix(`/api/products`)"
      service: "products-service"
      entrypoints:
        - web
      middlewares:
        - strip-prefix
    
    # Router para productos con tenant explícito
    products-tenant:
      rule: "PathPrefix(`/{tenant:[a-zA-Z0-9_-]+}/api/products`)"
      service: "products-service"
      entrypoints:
        - web
      middlewares:
        - tenant-extractor
        - strip-prefix

    # Router para administración de tenants (sin tenant requerido)
    tenants:
      rule: "PathPrefix(`/api/tenants`)"
      service: "tenant-service"
      entrypoints:
        - web
      middlewares:
        - strip-prefix

  middlewares:
    strip-prefix:
      stripPrefix:
        prefixes: ["/api"]
    
    # Middleware para extraer tenant de la ruta y agregarlo al header
    tenant-extractor:
      chain:
        middlewares:
          - tenant-header-setter
          - tenant-path-replacer
    
    tenant-path-replacer:
      replacePathRegex:
        regex: "^/([a-zA-Z0-9_-]+)/api/(.*)"
        replacement: "/api/$2"
    
    tenant-header-setter:
      headers:
        customRequestHeaders:
          X-Tenant-ID: "tenant"

  services:
    # Definición del servicio de usuarios (respaldo)
    users-service:
      loadBalancer:
        servers:
          - url: "http://users_api:8080"
        healthCheck:
          path: /health
          interval: "10s"
          timeout: "3s"
    
    # Definición del servicio de productos
    products-service:
      loadBalancer:
        servers:
          - url: "http://product_api:8081"
        healthCheck:
          path: /health
          interval: "10s"
          timeout: "3s"

    # Definición del servicio de tenants
    tenant-service:
      loadBalancer:
        servers:
          - url: "http://tenant_api:8082"
        healthCheck:
          path: /health
          interval: "10s"
          timeout: "3s"
