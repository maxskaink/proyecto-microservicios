<app-header></app-header>
<div class="orders-container container">
  
  <!-- Loading state -->
  <div *ngIf="isLoading" class="loading d-flex justify-content-center align-items-center w-100">
    <p class="text-center">Cargando órdenes...</p>
  </div>

  

  <!-- Empty orders -->
  <div *ngIf="!isLoading && orders?.length === 0 && oldOrders?.length === 0 " class="empty-orders  d-flex flex-column justify-content-center align-items-center w-100">
    <h2 class="">No tienes órdenes aún</h2>
    <p class="text-center">Cuando realices pedidos aparecerán aquí</p>
    <button  (click)="goToHome()" class="btn btn-primary mb-3">
      Ir a comprar   
    </button>
    <button (click)="loadUserOrders()" class="btn  btn-secondary">consultar otravez</button>
  </div>

  <!-- Orders list -->
  <div *ngIf="!isLoading && (orders?.length !== 0 || oldOrders?.length) !== 0" class="orders-list">
    <section class="d-flex justify-content-center flex-column align-items-center mb-4">
        <h3 class=" mb-4 title">Pedidos pendientes</h3>
        <p class="text">Revisa tus pedidos que tienes pendientes con nostoros</p>
    </section>
    <div class="row g-3 section-current">
      <div *ngFor="let order of orders" class="col-12 col-md-4 col-lg-6">
        <app-item-order [order]="order" class="order" (details)="viewOrderDetails($event)" (action)="handlerOrderAction($event)"></app-item-order>
      </div>
    </div>

  </div>

</div>
