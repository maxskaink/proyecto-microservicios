<nav class="navbar navbar-dark  fixed-top shadow-sm">
  <div class="container-fluid d-flex justify-content-between align-items-center flex-wrap">
    <button 
      class="navbar-toggler me-3" 
      type="button" 
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen"
      aria-controls="navbarNav"
      aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="d-flex align-items-center flex-wrap justify-content-end text-white">
      <div class="d-flex align-items-center me-3 mt-2 mt-md-0">
        <i 
          class="bi bi-person-circle fs-3 me-2" 
          style="cursor: pointer;"
        ></i>
        <span class="fw-semibold d-none d-sm-inline">{{ currentUser?.name }}</span>
      </div>
    </div>

  </div>
</nav>  

<section 
  id="helpNavbar" 
  class="bg-light py-2 fixed-top"
  style="top: 56px;">
  <div class="container-fluid separator "></div>
  <div class="container p-2">
    <div class="row align-items-center gy-2">
      <div class="col-12 col-md-6 d-flex justify-content-center justify-content-md-start gap-3">
        <p class="fw-bold mb-0 " style="cursor: pointer;" (click)="goToHome()">Catálogo</p>
        <p class="fw-bold mb-0" style="cursor: pointer;">Historial</p>
      </div>
      <div class="col-12 col-md-6">
        <form 
          class="d-flex justify-content-center justify-content-md-end mx-md-3"
          (ngSubmit)="onSearch()"
        >
          <input 
            class="form-control me-2 w-100 w-md-auto" 
            type="search" 
            placeholder="Buscar productos..."
            aria-label="Buscar"
            [(ngModel)]="searchTerm"
            name="searchTerm"
          >
          <button class="btn btn-light text-primary" type="submit">
            <i class="bi bi-search"></i>
          </button>
        </form>
      </div>

    </div>
  </div>
  
</section>

<!-- Espaciador para compensar el header fijo -->
<div class="header-spacer"></div>
