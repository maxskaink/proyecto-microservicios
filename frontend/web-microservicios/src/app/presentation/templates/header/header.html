
<!-- Header fijo con Bootstrap -->
<nav class="navbar navbar-dark bg-primary fixed-top shadow-sm">
  <div class="container-fluid">
    
    <!-- Botón hamburguesa (siempre visible) -->
    <button 
      class="navbar-toggler me-3" 
      type="button" 
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen"
      aria-controls="navbarNav"
      aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Carrito de compras (siempre visible en la derecha) -->
    <button 
      class="btn btn-outline-light position-relative" 
      (click)="goToCart()"
      title="Carrito de compras">
      <i class="bi bi-cart3"></i>
      <span 
        *ngIf="cartItemCount > 0" 
        class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
        {{ cartItemCount }}
        <span class="visually-hidden">productos en carrito</span>
      </span>
    </button>
  </div>

  <!-- Menú desplegable (controlado por hamburguesa) -->
  <div 
    class="collapse navbar-collapse hamburger-menu" 
    id="navbarNav"
    [class.show]="isMenuOpen">
    
    <div class="container-fluid">
      <!-- Enlaces de navegación -->
      <ul class="navbar-nav mb-3">
        <li class="nav-item">
          <a class="nav-link" (click)="navigateTo('/catalog')" role="button">
            <i class="bi bi-grid-3x3-gap me-2"></i>
            Catálogo
          </a>
        </li>
        <li class="nav-item" *ngIf="isLoggedIn">
          <a class="nav-link" (click)="navigateTo('/my-products')" role="button">
            <i class="bi bi-box-seam me-2"></i>
            Mis Productos
          </a>
        </li>
        <li class="nav-item" *ngIf="isLoggedIn">
          <a class="nav-link" (click)="navigateTo('/orders')" role="button">
            <i class="bi bi-clipboard-check me-2"></i>
            Pedidos
          </a>
        </li>
        <li class="nav-item" *ngIf="isLoggedIn">
          <a class="nav-link" (click)="navigateTo('/purchase-history')" role="button">
            <i class="bi bi-clock-history me-2"></i>
            Historial de Compras
          </a>
        </li>
      </ul>

      <!-- Sección de usuario -->
      <div class="navbar-nav border-top pt-3">
        
        <!-- Usuario autenticado -->
        <div *ngIf="isLoggedIn" class="user-section">
          <div class="d-flex align-items-center mb-3">
            <i class="bi bi-person-circle me-3 fs-3 text-light"></i>
            <div>
              <div class="text-light fw-bold">{{ getUserName() }}</div>
              <small class="text-light opacity-75">{{ currentUser?.email }}</small>
            </div>
          </div>
          
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" (click)="goToUserProfile()" role="button">
                <i class="bi bi-person me-2"></i>
                Mi Perfil
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-danger" (click)="logout()" role="button">
                <i class="bi bi-box-arrow-right me-2"></i>
                Cerrar Sesión
              </a>
            </li>
          </ul>
        </div>

        <!-- Usuario no autenticado -->
        <div *ngIf="!isLoggedIn" class="user-section">
          <a class="nav-link btn btn-outline-light text-center" (click)="navigateTo('/login')" role="button">
            <i class="bi bi-box-arrow-in-right me-2"></i>
            Iniciar Sesión
          </a>
        </div>
      </div>
    </div>
  </div>
</nav>

<!-- Espaciador para compensar el header fijo -->
<div class="header-spacer"></div>
