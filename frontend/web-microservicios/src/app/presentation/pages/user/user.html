<!-- Información del usuario -->
<div class="user-info card mb-4  text-center">

<div *ngIf="currentUser" class="container container-user p-4">

 <div class="  d-flex flex-column flex-md-row align-items-center gap-3 p-3">

  <!-- ICONO GRANDE -->
  <div class="text-center text-md-start">
    <i class="bi bi-person-circle" style="font-size: 130px;"></i>
  </div>

  <!-- INFO DEL USUARIO -->
  <div class="d-flex flex-column align-items-start flex-grow-1">

    <h2 class="fw-bold mb-0">
      {{ getUserDisplayName() }}
    </h2>

    <!-- Correo con truncate -->
    <p class="text-white mb-1 text-truncate w-100" 
       style="max-width: 250px;"
       [title]="currentUser.email">
      {{ currentUser.email }}
    </p>

    <!-- BADGE DE ROL -->
    <span 
      class="badge"
      [ngClass]="{
        'bg-success': isUserAdmin(),
        'bg-secondary': !isUserAdmin()
      }"
    >
      <i class="bi me-1"
         [class.bi-shield-check]="isUserAdmin()"
         [class.bi-person]="!isUserAdmin()"></i>
      {{ getUserRole() | uppercase }}
    </span>

    <!-- BOTÓN DE CERRAR SESIÓN -->
    <div class="mt-3">
      <button class="btn btn-danger" (click)="onLogout()">
        <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
      </button>
    </div>

  </div>
</div>


  <!-- DIVISOR -->
  <hr class="my-4">

</div>


</div>
<!-- Secciones dinámicas de opciones - Solo mostrar si está autenticado -->
<div class="sections-container" *ngIf="!isLoading ">
    <div *ngFor="let category of getCategories()" class="section-options card mb-4 p-4">
        <h4 class="title mb-4 border-bottom pb-2">
            <i class="bi bi-gear me-2" *ngIf="category === 'profile'"></i>
            <i class="bi bi-bag me-2" *ngIf="category === 'shopping'"></i>
            <i class="bi bi-briefcase me-2" *ngIf="category === 'business'"></i>
            {{ getCategoryName(category) }}
        </h4>
        
        <div class="row g-3">
            <div 
                *ngFor="let option of getOptionsByCategory(category)" 
                class="col-12 col-md-6 col-lg-4"
            >
                <div 
                    class="option-card p-3 border rounded-3 h-100 d-flex align-items-center cursor-pointer hover-shadow transition-all"
                    (click)="navigateToOption(option)"
                    role="button"
                    tabindex="0"
                    (keydown.enter)="navigateToOption(option)"
                    (keydown.space)="navigateToOption(option)"
                >
                    <div class="icon-container me-3 text-center">
                        <i class="bi {{ option.icon }} fs-2 icon"></i>
                    </div>
                    <div class="option-content flex-grow-1">
                        <h5 class="title-section mb-1 fw-bold">{{ option.title }}</h5>
                        <p class="description-section text-muted small mb-0">{{ option.description }}</p>
                    </div>
                    <div class="arrow-icon">
                        <i class="bi bi-chevron-right text-muted"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
