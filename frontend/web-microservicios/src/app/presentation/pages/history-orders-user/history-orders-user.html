<app-header></app-header>
<div class="orders-container container-fluid">
  <div class="header">
    <button class="back-button" routerLink="/user">
      <app-arrow-left></app-arrow-left>
    </button>
  </div>

  <!-- Loading state -->
  <div *ngIf="isLoading" class="loading d-flex justify-content-center align-items-center w-100">
    <p class="text-center">Cargando órdenes...</p>
  </div>

  

  <!-- Empty orders -->
  <div *ngIf="!isLoading && orders.length === 0" class="empty-orders  d-flex flex-column justify-content-center align-items-center w-100">
    <h2 class="">No tienes órdenes aún</h2>
    <p class="text-center">Cuando realices pedidos aparecerán aquí</p>
    <button  (click)="goToHome()" class="btn btn-primary mb-3">
      Ir a comprar   
    </button>
    <button (click)="loadUserOrders()" class="btn  btn-secondary">consultar otravez</button>
  </div>

  <!-- Orders list -->
  <div *ngIf="!isLoading  && orders.length > 0" class="orders-list ">
    <div class="row g-3">
      <div *ngFor="let order of orders" class="col-12 col-md-6 col-lg-4">
        <app-item-order [order]="order" [showActions]="false"></app-item-order>
      </div>
    </div>
  </div>

</div>
