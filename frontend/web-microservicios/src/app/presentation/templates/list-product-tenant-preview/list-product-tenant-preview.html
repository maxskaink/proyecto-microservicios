<div class="tenant-section ">
  <h2 class="p-4">{{ category }}</h2>
  <!-- Carrusel de productos del tenant -->
  <div class="products-carousel">
    <div class="carousel-container">
      <div 
        *ngFor="let product of products" 
        class="product-item">
        <app-product-box 
          [product]="product"
          (productClick)="onProductClick($event)">
        </app-product-box>
      </div>
    </div>
  </div>

  <!-- Separador entre tenants -->
  
</div>
