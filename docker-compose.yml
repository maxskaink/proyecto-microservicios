version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: users_db
    environment:
      POSTGRES_USER: users
      POSTGRES_PASSWORD: userspass
      POSTGRES_DB: users_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users -d users_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  users_api:
    build:
      context: ./users-micro
      dockerfile: Dockerfile
    container_name: users_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://users:userspass@db:5432/users_db?sslmode=disable"
      FIREBASE_PROJECT_ID: "local-project"
    ports:
      - "8080:8080"
    volumes:
      - ./users-micro:/app:Z
    command: air -c .air.toml
    user: "${UID}:${GID}"

volumes:
  db_data:
