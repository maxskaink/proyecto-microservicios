<app-header></app-header>

<div class="home-container">
  
  
  <!-- Loading -->
  <div *ngIf="isLoading" class="text-center py-5">
    <div class="spinner-border text-primary mb-3" role="status">
      <span class="visually-hidden">Cargando productos...</span>
    </div>
    <p class="text-muted">Cargando productos...</p>
  </div>

  <!-- Productos -->
  <section class="products-section py-5" *ngIf="!isLoading">
    <div class="container">
      <h2 class="mb-4">
        Productos ({{ allProducts.length }})
      </h2>

      <!-- Grid de productos -->
      <div class="row g-4">
        <div 
          *ngFor="let product of allProducts" 
          class="col-sm-6 col-md-4 col-lg-3">
          <app-product-box [product]="product"></app-product-box>
        </div>
      </div>

      <!-- Sin productos -->
      <div *ngIf="allProducts.length === 0" class="text-center py-5">
        <h4 class="text-muted">No hay productos disponibles</h4>
      </div>

    </div>
  </section>

</div>
