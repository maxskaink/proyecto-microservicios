<app-is-loading></app-is-loading>

<div class="login-wrapper d-flex justify-content-center align-items-center min-vh-100">
  <div class="form-login position-relative">
    <div class="card p-4 d-flex flex-column" style="height: 100%;">
      <form #loginForm="ngForm" (ngSubmit)="onLogin(loginForm)" class="w-100 flex-grow-1 d-flex flex-column justify-content-center">
        <h2 class="mb-4 fw-bold text-center textTitle">Iniciar sesión</h2>
        
        <!-- Mensaje de error -->
        <div *ngIf="showError" 
             class="alert alert-danger alert-dismissible fade show mb-3" 
             [attr.data-error-type]="errorType"
             role="alert">
          <div class="d-flex align-items-center">
            <i class="fas fa-exclamation-triangle me-2"></i>
            <div class="flex-grow-1">
     
            </div>
            <button type="button" class="btn-close" (click)="hideMessages()" aria-label="Close"></button>
          </div>
        </div>
        
        <!-- Mensaje de éxito -->
        <div *ngIf="showSuccess" class="alert alert-success alert-dismissible fade show mb-3" role="alert">
          <div class="d-flex align-items-center">
            <i class="fas fa-check-circle me-2"></i>
            <div class="flex-grow-1">Inicio de sesion exitoso</div>
            <div class="spinner-border spinner-border-sm ms-2" role="status" aria-hidden="true"></div>
          </div>
        </div>

        <!-- Selector de Tenant -->
        <div class="mb-3">
          <label for="tenant" class="form-label">Tienda</label>
          <select
            id="tenant"
            name="tenant"
            class="form-select"
            [class.is-invalid]="tenantError"
            [(ngModel)]="tenantId"
            required
            #tenantSelect="ngModel"
            (change)="onTenantChange()"
            [disabled]="isLoading || loadingTenants()"
          >
            <option value="">
              {{ loadingTenants() ? 'Cargando tiendas...' : 'Selecciona una tienda' }}
            </option>
            <option 
              *ngFor="let tenant of tenants()" 
              [value]="tenant.tenant_id">
              {{ tenant.tenant_name }}
            </option>
          </select>
          <div *ngIf="(tenantSelect.invalid && (tenantSelect.dirty || tenantSelect.touched || loginForm.submitted)) && !tenantError" class="text-danger small">
            Debes seleccionar una tienda.
          </div>
          <div *ngIf="tenantError" class="text-danger small">
            selecciona una tienda
          </div>
        </div>
        
        <div class="mb-3">
          <label for="correo" class="form-label">Correo</label>
          <input
            id="correo"
            type="email"
            name="correo"
            class="form-control"
            [class.is-invalid]="emailError"
            placeholder="ejemplo@correo.com"
            [(ngModel)]="correo"
            required
            email
            #correoInput="ngModel"
            (input)="onInputChange()"
            [disabled]="isLoading"
          />
          <div *ngIf="(correoInput.invalid && (correoInput.dirty || correoInput.touched || loginForm.submitted)) && !emailError" class="text-danger small">
            El correo es obligatorio y debe tener un formato válido.
          </div>
          <div *ngIf="emailError" class="text-danger small">
            El correoes obligatorio
          </div>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <input
            id="password"
            type="password"
            name="password"
            class="form-control"
            [class.is-invalid]="passwordError"
            placeholder=""
            [(ngModel)]="password"
            required
            minlength="6"
            #passwordInput="ngModel"
            (input)="onInputChange()"
            [disabled]="isLoading"
          />
          <div *ngIf="passwordError" class="text-danger small">
            la contraseña es incorrecta
          </div>
        </div>
        <button 
          type="submit" 
          class="btn button-pri w-100 position-relative" 
          [disabled]="loginForm.invalid || isLoading"
        >
          <span *ngIf="!isLoading">Entrar</span>
          <span *ngIf="isLoading" class="d-flex align-items-center justify-content-center">
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            Iniciando sesión...
          </span>
        </button>

        <!-- Divider -->
        <div class="text-center my-3">
          <span class="text-muted">o</span>
        </div>

        <!-- Google Login Button -->
        <button 
          type="button" 
          class="btn btn-outline-danger w-100 d-flex align-items-center justify-content-center"
          [disabled]="isLoading || !tenantId"
          (click)="loginWithGoogle()"
        >
          <span *ngIf="!isLoading" class="d-flex align-items-center justify-content-center">
            <svg class="me-2" width="18" height="18" viewBox="0 0 24 24">
              <path fill="#4285f4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34a853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#fbbc05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="#ea4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Continuar con Google
          </span>
          <span *ngIf="isLoading" class="d-flex align-items-center justify-content-center">
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            Autenticando con Google...
          </span>
        </button>
        
        <!-- Mensaje de ayuda para Google Login -->
        <div *ngIf="!tenantId" class="text-center mt-2">
          <small class="text-muted">Selecciona una tienda para continuar con Google</small>
        </div>
      </form>
      
    </div>
  </div>
</div>
