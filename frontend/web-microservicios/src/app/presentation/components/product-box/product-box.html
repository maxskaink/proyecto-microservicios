<div class="card   product-card" 
     style="width: 18rem; cursor: pointer;" 
     (click)="onProductClick()">
  <img [src]="product.photo_url" class="card-img-top" [alt]="product.description">
  <div class="card-body">
    <h5 class="card-title text-capitalize">{{ product.name }}</h5>
    <p><strong>Precio:</strong> {{ product.price | currency:'COP':'symbol':'1.0-0' }}</p>
  </div>
</div>
