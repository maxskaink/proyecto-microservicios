<app-header></app-header>   
<div class="shopping-cart-container container">


  <div class="row cart-content">
    <!-- Items del carrito -->
    <div class="col-12 col-lg-8">
      <app-product-view-buy
        *ngFor="let item of cartItems" 
        [item]="item"
        (remove)="removeItem($event)">
      </app-product-view-buy>
    </div>

    <!-- Resumen del carrito -->
    <div class="col-12 col-lg-4" *ngIf="!orderSuccess && !createdOrderResponse">
      <div class="cart-item sticky-summary p-4">
        <div class="summary-content mb-3">
          <h3 class="p-2">Resumen del pedido</h3>
          <div class="divider"></div>
          <div class="total-price p-3 d-flex justify-content-between align-items-center">
            <span class="label-text">Total de items:</span>
            <span><strong> {{ cartItems.length }}</strong></span>
          </div>
          <div class="divider"></div>
          <div class="total-price p-3 d-flex justify-content-between align-items-center">
            <span class="label-text">Total: </span>
            <span class="total-amount"> <strong> {{ formattedTotal }}</strong></span>
          </div>
          <div class="divider"></div>
          <button (click)="clearCart()" class="clear-cart-button btn w-100 mt-2">
            Vaciar carrito
          </button>
        </div>

        <!-- Checkout -->
        <div class="checkout-section" *ngIf="!orderSuccess && !createdOrderResponse">
          <h4 class="p-2">Información de envío</h4>
          <div class="form-group mb-3">
            <label for="shippingAddress" class="p-2 label-text">Dirección de envío:</label>
            <textarea
              id="shippingAddress"
              [(ngModel)]="shippingAddress"
              placeholder="Ingresa tu dirección completa"
              rows="3"
              maxlength="50"
              class="form-control p-2">
            </textarea>
          </div>

          <button 
            (click)="createOrder()"
            [disabled]="!canCheckout || isCreatingOrder"
            class=" btn-primary w-100">
            <span *ngIf="!isCreatingOrder">Crear orden</span>
            <span *ngIf="isCreatingOrder">Creando orden...</span>
          </button>
        </div>
      </div>
    </div>
    
  </div>
    <!-- Order success modal -->
<div 
  class="d-flex justify-content-center align-items-center w-100"
  style="min-height: 60vh;"
>
  <div 
    *ngIf="orderSuccess && createdOrderResponse"
    class="order-success-modal col-12 col-md-8 col-lg-6"
  >
    <app-order
      [createdOrderResponse]="createdOrderResponse"
      (close)="closeOrderSuccess()">
    </app-order>
  </div>    
</div>



</div>
