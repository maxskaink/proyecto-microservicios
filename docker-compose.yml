version: "3.9"

services:
  api-gateway:
    build:
      context: ./api-gateway
    container_name: api_gateway
    ports:
      - "80:8000"
      - "8090:8001"
      - "8443:8443"
      - "8444:8444"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001, 0.0.0.0:8444 ssl"
      KONG_PLUGINS: "tenant-extractor"
      KONG_LUA_PACKAGE_PATH: "/usr/local/share/lua/5.1/?.lua;;"
      KONG_DNS_RESOLVER: "10.200.0.2:8600"
      KONG_DNS_ORDER: "LAST,A,CNAME"
      CONSUL_HTTP_ADDR: "consul:8500"
    dns:
      - 10.200.0.2
    volumes:
      - ./api-gateway/kong:/kong:ro,z
      - ./api-gateway/plugins:/usr/local/share/lua/5.1/kong/plugins:ro,z
    depends_on:
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      micro-network:
        ipv4_address: 10.200.0.10

  consul:
    build:
      context: ./service-discovery
    container_name: consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    volumes:
      - consul_data:/consul/data
    networks:
      micro-network:
        ipv4_address: 10.200.0.2
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 5s
      retries: 10

  users_db:
    image: postgres:16-alpine
    container_name: users_db
    environment:
      POSTGRES_USER: users
      POSTGRES_PASSWORD: userspass
      POSTGRES_DB: users_db
    volumes:
      - micro_db_data:/var/lib/postgresql/data:z
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users -d users_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      micro-network:
        ipv4_address: 10.200.0.5

  users_api:
    build:
      context: ./users-micro
      dockerfile: Dockerfile
    container_name: users_api
    depends_on:
      users_db:
        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://users:userspass@users_db:5432/users_db?sslmode=disable"
      FIREBASE_PROJECT_ID: "local-project"
      SERVICE_NAME: "users-service"
      SERVICE_TAGS: "users,api"
      CONSUL_HTTP_ADDR: "consul:8500"
      TRAEFIK_ENABLE: "true"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
    volumes:
      - ./users-micro:/app:z
    command: air -c .air.toml
    networks:
      - micro-network

  product_db:
    image: postgres:16-alpine
    container_name: product_db
    environment:
      POSTGRES_USER: product
      POSTGRES_PASSWORD: productpass
      POSTGRES_DB: product_db
    volumes:
      - product_db_data:/var/lib/postgresql/data:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product -d product_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    ports:
      - "5433:5432"
    networks:
      micro-network:
        ipv4_address: 10.200.0.3

  tenant_db:
    image: postgres:16-alpine
    container_name: tenant_db
    environment:
      POSTGRES_USER: tenant
      POSTGRES_PASSWORD: tenantpass
      POSTGRES_DB: tenant_db
    volumes:
      - tenant_db_data:/var/lib/postgresql/data:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenant -d tenant_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    ports:
      - "5434:5432"
    networks:
      micro-network:
        ipv4_address: 10.200.0.4

  tenant_api:
    build:
      context: ./tenant-micro
      dockerfile: Dockerfile
    container_name: tenant_api
    depends_on:
      tenant_db:
        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      PORT: "8082"
      DB_HOST: "tenant_db"
      DB_USER: "tenant"
      DB_PASSWORD: "tenantpass"
      DB_NAME: "tenant_db"
      DB_PORT: "5432"
      RABBITMQ_USER: "guest"
      RABBITMQ_PASSWORD: "guest"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      SERVICE_NAME: "tenant-service"
      SERVICE_TAGS: "tenant,api"
      CONSUL_HTTP_ADDR: "consul:8500"
      TRAEFIK_ENABLE: "true"
    volumes:
      - ./tenant-micro:/app:z
    command: air -c .air.toml
    networks:
      - micro-network

  product_api:
    build:
      context: ./product-micro
      dockerfile: Dockerfile
    container_name: product_api
    depends_on:
      product_db:
        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      PORT: "8081"
      DATABASE_URL: "postgres://product:productpass@product_db:5432/product_db?sslmode=disable"
      SERVICE_NAME: "products-service"
      SERVICE_TAGS: "products,api"
      CONSUL_HTTP_ADDR: "consul:8500"
      TRAEFIK_ENABLE: "true"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
    volumes:
      - ./product-micro:/app:z
    command: air -c .air.toml
    networks:
      - micro-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq:z
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      micro-network:
        ipv4_address: 10.200.0.9

  shipping_db:
    image: postgres:16-alpine
    container_name: shipping_db
    environment:
      POSTGRES_USER: shipping
      POSTGRES_PASSWORD: shippingpass
      POSTGRES_DB: shipping_db
    volumes:
      - shipping_db_data:/var/lib/postgresql/data:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipping -d shipping_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    ports:
      - "5435:5432"
    networks:
      micro-network:
        ipv4_address: 10.200.0.6

  shipping_api:
    build:
      context: ./shipping-micro
      dockerfile: Dockerfile
    container_name: shipping_api
    depends_on:
      shipping_db:
        condition: service_healthy
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      PORT: "8083"
      DATABASE_URL: "postgres://shipping:shippingpass@shipping_db:5432/shipping_db?sslmode=disable"
      SERVICE_NAME: "shipping-service"
      SERVICE_TAGS: "shipping,api"
      CONSUL_HTTP_ADDR: "consul:8500"
      TRAEFIK_ENABLE: "true"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
    volumes:
      - ./shipping-micro:/app:z
    command: air -c .air.toml
    networks:
      - micro-network

volumes:
  product_db_data:
  micro_db_data:
  tenant_db_data:
  shipping_db_data:
  consul_data:
  rabbitmq_data:

networks:
  micro-network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.200.0.0/24
