<app-header></app-header>

<div class="home-container">
  
  <!-- Loading -->
  <div *ngIf="isLoading" class="text-center py-5">
    <div class="spinner-border text-primary mb-3" role="status">
      <span class="visually-hidden">Cargando productos...</span>
    </div>
    <p class="text-muted">Cargando productos...</p>
  </div>

  <!-- Error Message -->
  <div *ngIf="errorMessage && !isLoading" class="alert alert-danger m-3" role="alert">
    <i class="bi bi-exclamation-triangle me-2"></i>
    {{ errorMessage }}
    <button class="btn btn-sm btn-outline-danger ms-3" (click)="loadProducts()">
      Reintentar
    </button>
  </div>

  <!-- Productos -->
  <section class="products-section py-5" *ngIf="!isLoading && !errorMessage">
    <div class="container">
      
      <!-- Search Results Header -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">
          <span *ngIf="!isSearchActive">Todos los productos</span>
          <span *ngIf="isSearchActive">Resultados de búsqueda</span>
          <small class="text-muted">({{ productsToShow.length }})</small>
        </h2>
        
        <!-- Clear Search Button -->
        <button 
          *ngIf="isSearchActive" 
          class="btn btn-outline-secondary btn-sm"
          (click)="clearFilters()">
          <i class="bi bi-x-circle me-1"></i>
          Limpiar búsqueda
        </button>
      </div>

      <!-- Search Term Display -->
      <div *ngIf="isSearchActive" class="alert alert-info mb-4">
        <i class="bi bi-search me-2"></i>
        Buscando: <strong>"{{ searchTerm }}"</strong>
      </div>

      <!-- Grid de productos -->
      <div class="row g-4" *ngIf="hasProducts">
        <div 
          *ngFor="let product of productsToShow" 
          class="col-sm-6 col-md-4 col-lg-3">
          <app-product-box 
            [product]="product"
            (productClick)="onProductClick($event)">
          </app-product-box>
        </div>
      </div>

      <!-- Sin productos -->
      <div *ngIf="!hasProducts" class="text-center py-5">
        <div class="text-muted mb-3">
          <i class="bi bi-box-seam" style="font-size: 3rem;"></i>
        </div>
        <h4 class="text-muted" *ngIf="!isSearchActive">No hay productos disponibles</h4>
        <h4 class="text-muted" *ngIf="isSearchActive">No se encontraron productos</h4>
        <p class="text-muted" *ngIf="isSearchActive">
          Intenta con otros términos de búsqueda o 
          <button class="btn btn-link p-0" (click)="clearFilters()">ver todos los productos</button>
        </p>
      </div>

    </div>
  </section>

</div>
