<app-header></app-header>
<div class="orders-container">
  <div class="header">
    <button class="back-button" routerLink="/user">
      <app-arrow-left></app-arrow-left>
      Volver
    </button>
    <h1>Mis Órdenes</h1>
    <button (click)="refreshOrders()" class="refresh-button">
      🔄 Actualizar
    </button>
  </div>

  <!-- Loading state -->
  <div *ngIf="isLoading" class="loading">
    <p>Cargando órdenes...</p>
  </div>

  <!-- Error state -->
  <div *ngIf="!isLoading && error" class="error-message">
    <p>{{ error }}</p>
    <button (click)="refreshOrders()">Reintentar</button>
  </div>

  <!-- Empty orders -->
  <div *ngIf="!isLoading && !error && orders.length === 0" class="empty-orders">
    <h2>No tienes órdenes aún</h2>
    <p>Cuando realices pedidos aparecerán aquí</p>
    <button routerLink="/home" class="continue-shopping-button">
      Ir a comprar
    </button>
  </div>

  <!-- Orders list -->
  <div *ngIf="!isLoading && !error && orders.length > 0" class="orders-list">
    <div *ngFor="let order of orders" class="order-card">
      <div class="order-header">
        <app-item-order [order]="order"></app-item-order>
      </div>
      <div class="order-actions">
      </div>
    </div>
  </div>
</div>
